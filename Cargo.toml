[workspace]
resolver = "3"
members = ["peel", "peel-trace"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/PommeMC/Peel"

[workspace.dependencies]
peel-trace = { path = "peel-trace", version = "0.1.0" }
# Not on crates.io yet: point cargo at a local checkout with a gitignored
# `.cargo/config.toml` `[patch.crates-io]` entry. Never commit that patch.
pomme-protocol = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
anyhow = "1"
